<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Giá điện thoại & máy tính bảng</title>
<script>
  // Same light/dark choice as the other tuongphanbase pages, else the system's.
  (function(){
    let t = null; try{ t = localStorage.getItem('fleet_theme'); }catch(e){}
    document.documentElement.setAttribute('data-theme', t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
  })();
</script>
<link rel="stylesheet" href="../emailer-dashboard/theme.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="appbar">
  <a class="appbar-name" href="../emailer-dashboard/">tuongphanbase</a>
  <nav class="appbar-tabs" aria-label="Trang">
    <a href="../emailer-dashboard/">Bot</a>
    <a href="../emailer-dashboard/prices.html">Giá hôm nay</a>
    <a href="../emailer-dashboard/projects.html">Dự án</a>
  </nav>
</header>
<main>
  <div class="page-head">
    <div>
      <h1>Giá điện thoại & máy tính bảng</h1>
      <div class="page-sub" id="updated">Đang tải…</div>
    </div>
    <a class="btn" href="prices.csv" download>Tải CSV</a>
  </div>

  <section class="panel facts" aria-label="Tóm tắt">
    <div><span class="k">Sản phẩm</span><span class="v" id="items">—</span></div>
    <div><span class="k">Model so sánh được</span><span class="v" id="models">—</span></div>
    <div><span class="k">Cửa hàng hoạt động</span><span class="v" id="shopsOk">—</span></div>
  </section>

  <section class="tools" aria-label="Lọc">
    <input class="input q" id="q" type="search" placeholder="Tìm model, ví dụ iPhone 16 Pro Max, Galaxy S25, iPad Air" aria-label="Tìm model">
    <select class="input sel" id="cat" aria-label="Loại máy">
      <option value="">Tất cả loại</option>
      <option value="phone">Điện thoại</option>
      <option value="tablet">Máy tính bảng</option>
    </select>
    <select class="input sel" id="sort" aria-label="Sắp xếp">
      <option value="shops">Nhiều cửa hàng nhất</option>
      <option value="spread">Chênh giá nhiều nhất</option>
      <option value="low">Giá thấp đến cao</option>
      <option value="high">Giá cao đến thấp</option>
    </select>
    <label class="check"><input id="multi" type="checkbox" checked> Chỉ model có ở 2 cửa hàng trở lên</label>
  </section>

  <div class="panel">
    <div class="list-head"><span id="count">—</span><span>Giá rẻ nhất</span></div>
    <div id="list" class="list"></div>
  </div>
  <button id="more" class="btn more" type="button" hidden>Xem thêm</button>

  <details class="panel shops">
    <summary>Tình trạng các cửa hàng</summary>
    <div id="shops"></div>
  </details>
</main>
<script src="app.js"></script>
</body>
</html>
